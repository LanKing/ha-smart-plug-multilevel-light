name: Generate README translations

on:
  push:
    paths:
      - ".github/workflows/generate-readme-translations.yml"
      - "scripts/generate_readme_translations.py"
  workflow_dispatch:
    inputs:
      overwrite:
        description: Regenerate existing translations
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: readme-translations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Markdown translator
        uses: actions/checkout@v4
        with:
          repository: ikhsan3adi/markdown-translator
          ref: 629de65807486cf6ad68605cd03728da7cc90fbd
          path: .readme-translator

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install translator dependencies
        working-directory: .readme-translator
        run: npm ci

      - name: Limit translation requests to controlled batches
        working-directory: .readme-translator
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/lib.ts")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"  await Promise\.all\(\s*"
              r"unique\.map\(async \(value\) => \{\s*"
              r"translated\.set\(value, await translateFn\(value\)\)\s*"
              r"\}\),\s*"
              r"\)"
          )
          replacement = """  const batchSize = 25
          for (let index = 0; index < unique.length; index += batchSize) {
            const batch = unique.slice(index, index + batchSize)
            await Promise.all(
              batch.map(async (value) => {
                const leading = value.match(/^\\s*/)?.[0] ?? ''
                const trailing = value.match(/\\s*$/)?.[0] ?? ''
                const core = value.slice(leading.length, value.length - trailing.length)
                const result = core ? await translateFn(core) : core
                translated.set(value, leading + result + trailing)
              }),
            )
            await new Promise((resolve) => setTimeout(resolve, 200))
          }"""
          text, count = pattern.subn(lambda _match: replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not patch translator request scheduling")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Generate translations from Russian README
        env:
          OVERWRITE: true
        run: |
          args=()
          if [ "$OVERWRITE" = "true" ]; then
            args+=(--overwrite)
          fi
          python scripts/generate_readme_translations.py \
            --translator-dir .readme-translator \
            "${args[@]}"
