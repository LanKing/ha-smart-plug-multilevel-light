name: Remove root README image breaks once

on:
  push:
    paths:
      - ".github/workflows/remove-root-readme-image-breaks-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove breaks after Markdown images in root README
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('![Mode edit](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-edit.png)<br /><br />', '![Mode edit](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-edit.png)')
          s = s.replace('![Modes list](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-list.png)<br />', '![Modes list](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-list.png)')
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m "Remove breaks after root README images"
          fi
          git rm .github/workflows/remove-root-readme-image-breaks-once.yml
          git commit -m "Remove one-time README image break workflow"
          git pull --rebase
          git push
