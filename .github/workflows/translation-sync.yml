name: Translation sync

on:
  push:
    paths:
      - "scripts/sync_new_settings_translations.py"
      - "custom_components/smart_plug_multilevel_light/strings.json"
      - "custom_components/smart_plug_multilevel_light/translations/**"
      - "custom_components/smart_plug_multilevel_light/static/smart-plug-multilevel-light-locales.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize translations
        run: |
          python scripts/sync_new_settings_translations.py
      - name: Commit synchronized files
        run: |
          if git diff --quiet; then
            echo "Translations are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/smart_plug_multilevel_light/translations custom_components/smart_plug_multilevel_light/static/smart-plug-multilevel-light-locales.js
          git commit -m "Synchronize translations"
          git push
