name: Fix README image spacing once

on:
  push:
    paths:
      - ".github/workflows/fix-readme-image-spacing-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove blank line after first mode image
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [Path('README.md'), *sorted(Path('docs').glob('README_*.md'))]
          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              old = text
              text = text.replace('width="465"/><br /><br />\n\n', 'width="465"/><br /><br />\n')
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit README changes and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-readme-image-spacing-once.yml
          git add README.md docs/README_*.md .github/workflows/fix-readme-image-spacing-once.yml
          if git diff --cached --quiet; then
            echo "Nothing to change."
            exit 0
          fi
          git commit -m "Remove blank line after first README mode image"
          git pull --rebase
          git push
