name: Repair translated README fragments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-readme-fragments.yml"

permissions:
  contents: write

concurrency:
  group: repair-readme-fragments
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translator
        run: pip install deep-translator==1.11.4

      - name: Repair bounded README fragments
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import time
          from deep_translator import GoogleTranslator

          TARGETS = {
              "af":"af","ar":"ar","bg":"bg","bn":"bn","bs":"bs","ca":"ca","cs":"cs",
              "cy":"cy","da":"da","el":"el","eo":"eo","et":"et","eu":"eu","fa":"fa",
              "fi":"fi","fy":"fy","ga":"ga","gl":"gl","gsw":"de","he":"iw","hi":"hi",
              "hr":"hr","hu":"hu","hy":"hy","id":"id","is":"is","it":"it","ja":"ja",
              "ka":"ka","ko":"ko","lb":"lb","lt":"lt","lv":"lv","mk":"mk","ml":"ml",
              "nb":"no","nl":"nl","nn":"no","pt":"pt","pt-BR":"pt","ro":"ro","sk":"sk",
              "sl":"sl","sq":"sq","sr":"sr","sr-Latn":"sr","sv":"sv","ta":"ta","te":"te",
              "th":"th","tr":"tr","ur":"ur","vi":"vi","zh-Hans":"zh-CN","zh-Hant":"zh-TW"
          }

          SUMMARIES = [
              "The integration does not appear in the helper list",
              "The plug list is empty",
              "Creation stops with a missing power sensor message",
              "The lamp is shown as Off while the plug is on",
              "The lamp is shown as On while it is physically off",
              "The wrong mode is detected",
              "Mode changes are not displayed immediately",
              "The card does not appear in the list",
              "The old card is still displayed after an update",
          ]

          TABLE_PARTS = [
              "Parameter", "Type", "Default", "Description",
              "required", "entity created by the integration",
              "entity name", "overrides the name shown on the card",
              "entity icon", "overrides the icon",
              "shows the mode name", "shows the synthetic percentage",
              "additional action when the icon is tapped",
              "always shows the circular icon background, even when None is selected for icon_tap_action",
          ]

          FOOTER_PARTS = [
              "License",
              "This project is distributed under the 731948731948 license.",
              "Like this solution?",
              "Take a look at",
              "my other Home Assistant products",
          ]

          PROTECTED = {
              "Home Assistant": "ZXQHOMEASSISTANTQXZ",
              "icon_tap_action": "ZXQICONTAPACTIONQXZ",
              "None": "ZXQNONEQXZ",
          }

          def protect(text):
              for source, token in PROTECTED.items():
                  text = text.replace(source, token)
              return text

          def restore(text):
              for source, token in PROTECTED.items():
                  text = text.replace(token, source)
              return text

          def translate_parts(parts, target):
              markers = [f"731947{index:06d}" for index in range(1, len(parts) + 1)]
              source = "\n".join(
                  f"{marker}\n{protect(value)}"
                  for marker, value in zip(markers, parts)
              )
              last = None
              for attempt in range(5):
                  try:
                      translated = GoogleTranslator(source="en", target=target).translate(source)
                      if not translated:
                          raise RuntimeError("empty translation")
                      positions = [translated.find(marker) for marker in markers]
                      if any(position < 0 for position in positions):
                          raise RuntimeError("translation markers were changed")
                      values = []
                      for index, marker in enumerate(markers):
                          start = positions[index] + len(marker)
                          end = positions[index + 1] if index + 1 < len(markers) else len(translated)
                          values.append(restore(translated[start:end].strip()))
                      return values
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"Translation to {target} failed: {last}")

          CYRILLIC = str.maketrans({
              "А":"A","Б":"B","В":"V","Г":"G","Д":"D","Ђ":"Đ","Е":"E","Ж":"Ž","З":"Z",
              "И":"I","Ј":"J","К":"K","Л":"L","Љ":"Lj","М":"M","Н":"N","Њ":"Nj","О":"O",
              "П":"P","Р":"R","С":"S","Т":"T","Ћ":"Ć","У":"U","Ф":"F","Х":"H","Ц":"C",
              "Ч":"Č","Џ":"Dž","Ш":"Š","а":"a","б":"b","в":"v","г":"g","д":"d","ђ":"đ",
              "е":"e","ж":"ž","з":"z","и":"i","ј":"j","к":"k","л":"l","љ":"lj","м":"m",
              "н":"n","њ":"nj","о":"o","п":"p","р":"r","с":"s","т":"t","ћ":"ć","у":"u",
              "ф":"f","х":"h","ц":"c","ч":"č","џ":"dž","ш":"š",
          })

          def maybe_latin(values, code):
              return [value.translate(CYRILLIC) for value in values] if code == "sr-Latn" else values

          changed = []
          cache = {}
          for path in sorted(Path("docs").glob("README_*.md")):
              code = path.stem.removeprefix("README_")
              target = TARGETS.get(code)
              if not target:
                  continue

              cache_key = (target, code == "sr-Latn")
              if cache_key not in cache:
                  summaries = maybe_latin(translate_parts(SUMMARIES, target), code)
                  table = maybe_latin(translate_parts(TABLE_PARTS, target), code)
                  footer = maybe_latin(translate_parts(FOOTER_PARTS, target), code)
                  cache[cache_key] = summaries, table, footer
                  time.sleep(0.3)
              summaries, table, footer = cache[cache_key]

              text = path.read_text(encoding="utf-8")
              original = text

              summary_index = 0
              def replace_summary(_match):
                  global summary_index
                  value = f"<summary><b>❓{summaries[summary_index]}</b></summary>"
                  summary_index += 1
                  return value

              text = re.sub(
                  r"<summary><b>.*?</b></summary>",
                  replace_summary,
                  text,
              )
              if summary_index != len(SUMMARIES):
                  raise RuntimeError(f"Expected 9 summaries in {path}, got {summary_index}")

              rows = [
                  f"| {table[0]} | {table[1]} | {table[2]} | {table[3]} |",
                  "|---|---|---:|---|",
                  f"| `entity` | string | {table[4]} | {table[5]} |",
                  f"| `name` | string | {table[6]} | {table[7]} |",
                  f"| `icon` | string | {table[8]} | {table[9]} |",
                  f"| `show_mode` | boolean | `true` | {table[10]} |",
                  f"| `show_percentage` | boolean | `true` | {table[11]} |",
                  f"| `icon_tap_action` | action | `more-info` | {table[12]} |",
                  f"| `always_show_icon_background` | boolean | `false` | {table[13]} |",
              ]
              table_block = "\n".join(rows) + "\n"
              table_start = text.find("\\n|")
              code_start = text.find("\\n\`\`\`yaml", table_start)
              if table_start < 0 or code_start < 0:
                  raise RuntimeError(f"Parameter table boundaries not found in {path}")
              between = text[table_start + 1:code_start].rstrip()
              blocks = between.split("\\n\\n")
              if len(blocks) < 2:
                  raise RuntimeError(f"Full-example label not found after table in {path}")
              example_label = blocks[-1]
              text = (
                  text[:table_start + 1]
                  + table_block
                  + "\\n"
                  + example_label
                  + "\\n"
                  + text[code_start:]
              )

              license_sentence = footer[1].replace("731948731948", "[MIT](../LICENSE)")
              footer_block = (
                  f"## 📄 {footer[0]}\n\n"
                  f"{license_sentence}\n\n"
                  "<br />\n\n"
                  "> [!TIP]\n"
                  f"> **{footer[2]}** {footer[3]} 🏠 "
                  f'<a href="https://github.com/LanKing/ha-tools/blob/main/docs/README_{code}.md">'
                  f"{footer[4]}</a>\n"
              )
              footer_start = text.rfind("\n## ")
              if footer_start < 0:
                  raise RuntimeError(f"Final section not found in {path}")
              text = text[:footer_start + 1] + footer_block

              if text.count("<details>") != 9 or text.count("</details>") != 9:
                  raise RuntimeError(f"Details structure changed in {path}")
              for row in rows:
                  if row.count("|") != 5:
                      raise RuntimeError(f"Malformed table row in {path}: {row}")
              if "> [!TIP]" not in text or "[MIT](../LICENSE)" not in text:
                  raise RuntimeError(f"Protected footer markup changed in {path}")

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))
              print(f"repaired {path}")

          print(f"Changed {len(changed)} README files")
          PY

      - name: Commit repaired READMEs
        run: |
          if git diff --quiet -- docs; then
            echo "No README changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Repair translated README fragments"
          git pull --rebase origin main
          git push
