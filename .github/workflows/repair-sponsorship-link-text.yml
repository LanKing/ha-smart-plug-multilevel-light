name: Repair sponsorship wording

on:
  push:
    paths:
      - .github/workflows/repair-sponsorship-link-text.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translator
        run: pip install deep-translator==1.11.4
      - name: Repair sponsorship sentence wording
        run: |
          python <<'PY'
          from pathlib import Path
          import re, time
          from deep_translator import GoogleTranslator

          TARGETS = {
              "af":"af","ar":"ar","bg":"bg","bn":"bn","bs":"bs","ca":"ca","cs":"cs","cy":"cy","da":"da","de":"de","el":"el","eo":"eo","es":"es","et":"et","eu":"eu","fa":"fa","fi":"fi","fy":"fy","fr":"fr","ga":"ga","gl":"gl","gsw":"de","he":"iw","hi":"hi","hr":"hr","hu":"hu","hy":"hy","id":"id","is":"is","it":"it","ja":"ja","ka":"ka","ko":"ko","lb":"lb","lt":"lt","lv":"lv","mk":"mk","ml":"ml","nb":"no","nl":"nl","nn":"no","pl":"pl","pt":"pt","pt-BR":"pt","ro":"ro","ru":"ru","sk":"sk","sl":"sl","sq":"sq","sr":"sr","sr-Latn":"sr","sv":"sv","ta":"ta","te":"te","th":"th","tr":"tr","uk":"uk","ur":"ur","vi":"vi","zh-Hans":"zh-CN","zh-Hant":"zh-TW"
          }
          SOURCE = "If this project saved you some time, you can support my experiments."
          CYRILLIC = str.maketrans({"А":"A","Б":"B","В":"V","Г":"G","Д":"D","Ђ":"Đ","Е":"E","Ж":"Ž","З":"Z","И":"I","Ј":"J","К":"K","Л":"L","Љ":"Lj","М":"M","Н":"N","Њ":"Nj","О":"O","П":"P","Р":"R","С":"S","Т":"T","Ћ":"Ć","У":"U","Ф":"F","Х":"H","Ц":"C","Ч":"Č","Џ":"Dž","Ш":"Š","а":"a","б":"b","в":"v","г":"g","д":"d","ђ":"đ","е":"e","ж":"ž","з":"z","и":"i","ј":"j","к":"k","л":"l","љ":"lj","м":"m","н":"n","њ":"nj","о":"o","п":"p","р":"r","с":"s","т":"t","ћ":"ć","у":"u","ф":"f","х":"h","ц":"c","ч":"č","џ":"dž","ш":"š"})

          def translate(target, latin=False):
              last = None
              for attempt in range(5):
                  try:
                      value = GoogleTranslator(source="en", target=target).translate(SOURCE)
                      if not value:
                          raise RuntimeError("empty translation")
                      return value.translate(CYRILLIC) if latin else value
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"translation failed for {target}: {last}")

          pattern = re.compile(r'(?m)^(?!## ).*\[.*?\]\(https://github\.com/sponsors/LanKing\).*?☕🔧$')
          cache = {}
          paths = sorted(Path("docs").glob("README_*.md"))
          for path in paths:
              code = path.stem.removeprefix("README_")
              key = (TARGETS[code], code == "sr-Latn")
              if key not in cache:
                  cache[key] = translate(*key)
                  time.sleep(0.2)
              sentence = cache[key].rstrip().rstrip(".")
              text = path.read_text(encoding="utf-8")
              if len(list(pattern.finditer(text))) != 1:
                  raise RuntimeError(f"Expected one sponsorship sentence in {path}")
              replacement = f"[{sentence}](https://github.com/sponsors/LanKing) (GitHub Sponsors). ☕🔧"
              path.write_text(pattern.sub(replacement, text, count=1), encoding="utf-8")
              print(f"repaired {path}: {replacement}")
          PY
      - name: Validate and commit
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          allowed = {str(p) for p in Path("docs").glob("README_*.md")}
          if not changed or any(p not in allowed for p in changed):
              raise SystemExit(f"Unexpected changed files: {changed}")
          for p in changed:
              text = Path(p).read_text(encoding="utf-8")
              if text.count("https://github.com/sponsors/LanKing") != 2:
                  raise SystemExit(f"Wrong sponsorship link count in {p}")
              if "GitHub Sponsors" not in text:
                  raise SystemExit(f"GitHub Sponsors missing in {p}")
          ru = Path("docs/README_ru.md").read_text(encoding="utf-8")
          for bad in ("по номеру GitHub Sponsors", "за номером GitHub Sponsors"):
              if bad in ru:
                  raise SystemExit("Known bad Russian wording remains")
          print(f"Validated {len(changed)} translated READMEs")
          PY
          rm .github/workflows/repair-sponsorship-link-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/repair-sponsorship-link-text.yml
          git commit -m "Refine translated sponsorship wording"
          git pull --rebase origin main
          git push
