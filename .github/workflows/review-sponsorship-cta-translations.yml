name: Review sponsorship CTA translations

on:
  push:
    paths:
      - .github/workflows/review-sponsorship-cta-translations.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translator
        run: pip install deep-translator==1.11.4
      - name: Review and correct sponsorship CTA labels
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re, time
          from deep_translator import GoogleTranslator

          TARGETS = {
              "af":"af","ar":"ar","bg":"bg","bn":"bn","bs":"bs","ca":"ca","cs":"cs","cy":"cy",
              "da":"da","de":"de","el":"el","eo":"eo","es":"es","et":"et","eu":"eu","fa":"fa",
              "fi":"fi","fy":"fy","fr":"fr","ga":"ga","gl":"gl","gsw":"de","he":"iw","hi":"hi",
              "hr":"hr","hu":"hu","hy":"hy","id":"id","is":"is","it":"it","ja":"ja","ka":"ka",
              "ko":"ko","lb":"lb","lt":"lt","lv":"lv","mk":"mk","ml":"ml","nb":"no","nl":"nl",
              "nn":"no","pl":"pl","pt":"pt","pt-BR":"pt","ro":"ro","ru":"ru","sk":"sk","sl":"sl",
              "sq":"sq","sr":"sr","sr-Latn":"sr","sv":"sv","ta":"ta","te":"te","th":"th","tr":"tr",
              "uk":"uk","ur":"ur","vi":"vi","zh-Hans":"zh-CN","zh-Hant":"zh-TW"
          }

          # Imperative CTA. The exclamation mark intentionally forces a one-time call to action
          # instead of a habitual/progressive form in languages where that distinction matters.
          SOURCE = "Support my work!"
          MANUAL = {
              "uk": "Підтримайте мою роботу",
              "ru": "Поддержите мою работу",
              "pl": "Wesprzyj moją pracę",
              "cs": "Podpořte mou práci",
              "sk": "Podporte moju prácu",
              "bg": "Подкрепете работата ми",
              "hr": "Podržite moj rad",
              "bs": "Podržite moj rad",
              "sr": "Подржите мој рад",
              "sr-Latn": "Podržite moj rad",
              "mk": "Поддржете ја мојата работа",
              "sl": "Podprite moje delo",
          }

          def translated_label(code, target):
              if code in MANUAL:
                  return MANUAL[code]
              last = None
              for attempt in range(5):
                  try:
                      value = GoogleTranslator(source="en", target=target).translate(SOURCE).strip()
                      value = value.rstrip(".!?！？。؟ ")
                      if not value:
                          raise RuntimeError("empty translation")
                      return value
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"translation failed for {code}/{target}: {last}")

          # Match only the sponsorship badge, not the bottom Markdown link.
          badge = re.compile(
              r'<a href="https://github\.com/sponsors/LanKing"><img src="https://img\.shields\.io/badge/☕-[^"]+-ea4aaa" alt="[^"]+"></a>'
          )

          paths = sorted(Path("docs").glob("README_*.md"))
          changed = []
          labels = {}
          for path in paths:
              code = path.stem.removeprefix("README_")
              label = translated_label(code, TARGETS[code])
              labels[code] = label
              text = path.read_text(encoding="utf-8")
              matches = list(badge.finditer(text))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one sponsorship badge in {path}, got {len(matches)}")
              encoded = quote(label, safe="")
              replacement = (
                  '<a href="https://github.com/sponsors/LanKing">'
                  f'<img src="https://img.shields.io/badge/☕-{encoded}-ea4aaa" alt="{label}"></a>'
              )
              new_text = badge.sub(replacement, text, count=1)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(str(path))
              print(f"{code}: {label}")
              time.sleep(0.15)

          # Structural checks for all translated READMEs.
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count("https://github.com/sponsors/LanKing") != 2:
                  raise RuntimeError(f"Expected exactly two sponsorship links in {path}")
              code = path.stem.removeprefix("README_")
              if f'alt="{labels[code]}"' not in text:
                  raise RuntimeError(f"Badge alt mismatch in {path}")

          uk = Path("docs/README_uk.md").read_text(encoding="utf-8")
          if "Підтримуйте мою роботу" in uk or "Підтримайте мою роботу" not in uk:
              raise RuntimeError("Ukrainian CTA aspect is incorrect")

          print(f"Updated {len(changed)} of {len(paths)} translated README badges")
          PY
      - name: Commit reviewed translations and remove one-time workflow
        run: |
          rm .github/workflows/review-sponsorship-cta-translations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/review-sponsorship-cta-translations.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Review sponsorship CTA translations"
          git pull --rebase origin main
          git push
