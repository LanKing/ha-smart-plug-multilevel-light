name: Apply dumb lamp wording

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-dumb-lamp-wording.yml

permissions:
  contents: write

concurrency:
  group: apply-dumb-lamp-wording
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply wording only where the smart/dumb joke is natural
        run: |
          python <<'PY'
          from pathlib import Path

          ROOT_LINE = "2. A dumb lamp that turns on automatically when power is supplied and, ideally, has several brightness modes."

          # Deliberately conservative: only languages where a literal smart/dumb-style
          # opposition reads as an understandable joke are listed here. Other locales
          # keep their existing neutral equivalent of “non-smart lamp”.
          LINES = {
              "af": "2. 'n Dom lamp wat outomaties aanskakel wanneer krag voorsien word en verkieslik verskeie helderheidsmodusse het.",
              "bg": "2. Глупава лампа, която се включва автоматично при подаване на захранване и в идеалния случай има няколко режима на яркост.",
              "bs": "2. Glupa lampa koja se automatski uključuje kada dobije napajanje i, idealno, ima nekoliko režima svjetline.",
              "ca": "2. Una làmpada tonta que s'encén automàticament quan rep alimentació i que, idealment, té diversos modes de brillantor.",
              "cs": "2. Hloupá lampa, která se po přivedení napájení automaticky zapne a ideálně má několik režimů jasu.",
              "da": "2. En dum lampe, der tænder automatisk, når den får strøm, og som helst har flere lysstyrkeniveauer.",
              "de": "2. Eine dumme Lampe, die sich automatisch einschaltet, sobald sie Strom bekommt, und idealerweise mehrere Helligkeitsstufen hat.",
              "el": "2. Μια χαζή λάμπα που ανάβει αυτόματα όταν τροφοδοτείται με ρεύμα και, ιδανικά, έχει πολλές λειτουργίες φωτεινότητας.",
              "eo": "2. Stulta lampo, kiu aŭtomate ŝaltiĝas kiam ĝi ricevas kurenton kaj, ideale, havas plurajn brilreĝimojn.",
              "es": "2. Una lámpara tonta que se enciende automáticamente al recibir alimentación y que, idealmente, tiene varios modos de brillo.",
              "fi": "2. Tyhmä lamppu, joka syttyy automaattisesti saatuaan virtaa ja jossa on mieluiten useita kirkkaustiloja.",
              "hr": "2. Glupa lampa koja se automatski uključuje kada dobije napajanje i, idealno, ima nekoliko načina svjetline.",
              "hu": "2. Egy buta lámpa, amely áramot kapva automatikusan bekapcsol, és ideális esetben több fényerőmóddal rendelkezik.",
              "it": "2. Una lampada stupida che si accende automaticamente quando riceve alimentazione e che, idealmente, dispone di più modalità di luminosità.",
              "nb": "2. En dum lampe som slår seg på automatisk når den får strøm, og som helst har flere lysstyrkenivåer.",
              "nl": "2. Een domme lamp die automatisch inschakelt zodra hij stroom krijgt en die bij voorkeur meerdere helderheidsstanden heeft.",
              "nn": "2. Ei dum lampe som slår seg på automatisk når ho får straum, og som helst har fleire lysstyrkenivå.",
              "pl": "2. Głupiej lampy, która włącza się automatycznie po podaniu zasilania i najlepiej ma kilka trybów jasności.",
              "pt": "2. Uma lâmpada burra que se liga automaticamente quando recebe alimentação e que, idealmente, tem vários modos de brilho.",
              "pt-BR": "2. Uma lâmpada burra que liga automaticamente quando recebe energia e que, de preferência, tem vários modos de brilho.",
              "ru": "2. Глупый светильник, который после включения в розетку включается автоматически и для полного удовольствия имеет несколько режимов яркости.",
              "sk": "2. Hlúpa lampa, ktorá sa po privedení napájania automaticky zapne a ideálne má niekoľko režimov jasu.",
              "sl": "2. Neumna svetilka, ki se ob priklopu napajanja samodejno vklopi in ima po možnosti več načinov svetlosti.",
              "sr": "2. Глупа лампа која се аутоматски укључује када добије напајање и, идеално, има неколико режима осветљености.",
              "sr-Latn": "2. Glupa lampa koja se automatski uključuje kada dobije napajanje i, idealno, ima nekoliko režima osvetljenosti.",
              "sv": "2. En dum lampa som tänds automatiskt när den får ström och som helst har flera ljusstyrkelägen.",
              "uk": "2. Дурний світильник, який автоматично вмикається після подачі живлення і, в ідеалі, має кілька режимів яскравості.",
          }

          def replace_first_item2(path: Path, replacement: str):
              text = path.read_text(encoding="utf-8")
              marker1 = "\n1. "
              marker2 = "\n2. "
              p1 = text.find(marker1)
              if p1 < 0:
                  raise RuntimeError(f"First numbered list not found in {path}")
              p2 = text.find(marker2, p1)
              if p2 < 0:
                  raise RuntimeError(f"Second hardware item not found in {path}")
              end = text.find("\n", p2 + 1)
              if end < 0:
                  raise RuntimeError(f"Hardware item line end not found in {path}")
              current = text[p2 + 1:end]
              if "lamp" not in current.lower() and path.name == "README.md":
                  raise RuntimeError(f"Unexpected English hardware item: {current}")
              new_text = text[:p2 + 1] + replacement + text[end:]
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  return True
              return False

          changed = []
          root = Path("README.md")
          if replace_first_item2(root, ROOT_LINE):
              changed.append(str(root))

          for code, line in LINES.items():
              path = Path("docs") / f"README_{code}.md"
              if not path.exists():
                  raise RuntimeError(f"Missing locale README: {path}")
              if replace_first_item2(path, line):
                  changed.append(str(path))

          print("Changed files:")
          for path in changed:
              print(path)
          print(f"Total: {len(changed)}")
          PY

      - name: Validate bounded change
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('README.md').read_text(encoding='utf-8')
          assert '\n2. A dumb lamp that turns on automatically' in root
          assert '\n2. A non-smart lamp that turns on automatically' not in root
          ru = Path('docs/README_ru.md').read_text(encoding='utf-8')
          assert '\n2. Глупый светильник,' in ru
          pl = Path('docs/README_pl.md').read_text(encoding='utf-8')
          assert '\n2. Głupiej lampy,' in pl
          PY

      - name: Commit wording update and remove one-time workflow
        run: |
          rm .github/workflows/apply-dumb-lamp-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs .github/workflows/apply-dumb-lamp-wording.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Use dumb lamp joke where it translates naturally"
          git pull --rebase origin main
          git push
