name: Generate brand assets

on:
  push:
    paths:
      - '.brand-source.svg'
      - '.github/workflows/generate-brand.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Render Home Assistant brand assets
        run: |
          mkdir -p custom_components/smart_plug_multilevel_light/brand
          python - <<'PY'
          import cairosvg
          source = '.brand-source.svg'
          target = 'custom_components/smart_plug_multilevel_light/brand'
          cairosvg.svg2png(url=source, write_to=f'{target}/icon.png', output_width=256, output_height=256)
          cairosvg.svg2png(url=source, write_to=f'{target}/icon@2x.png', output_width=512, output_height=512)
          PY
          rm .brand-source.svg

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .brand-source.svg custom_components/smart_plug_multilevel_light/brand
          git diff --cached --exit-code && exit 0
          git commit -m 'Add Home Assistant brand assets'
          git push
