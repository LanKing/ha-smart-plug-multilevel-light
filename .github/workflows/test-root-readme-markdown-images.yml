name: Test root README Markdown images

on:
  push:
    paths:
      - ".github/workflows/test-root-readme-markdown-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace two HTML images with Markdown in root README only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '<img src="https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-edit.png" width="465"/><br /><br />',
              '![Brightness mode editor](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-edit.png)<br /><br />'
          )
          s = s.replace(
              '<img src="https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-list.png" width="457"/><br />',
              '![Brightness modes list](https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/docs/modes-list.png)<br />'
          )
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit root README change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Test Markdown images in root README" || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/test-root-readme-markdown-images.yml
          git commit -m "Remove root README image test workflow"
          git push
