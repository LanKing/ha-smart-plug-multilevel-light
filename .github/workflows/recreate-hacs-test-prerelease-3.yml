name: Recreate HACS test prerelease 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recreate-hacs-test-prerelease-3.yml'

permissions:
  contents: write

jobs:
  recreate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete previous prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v0.10.11-test.2 --cleanup-tag -y || true

      - name: Build HACS archive
        run: |
          cd custom_components/smart_plug_multilevel_light
          zip -r "$GITHUB_WORKSPACE/smart-plug-multilevel-light.zip" .

      - name: Create fresh prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.10.11-test.3 \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "v0.10.11-test.3" \
            --notes "HACS cache-bypass test prerelease." \
            smart-plug-multilevel-light.zip

      - name: Remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git rm .github/workflows/recreate-hacs-test-prerelease-3.yml
          git commit -m "Remove one-time prerelease 3 workflow"
          git push
