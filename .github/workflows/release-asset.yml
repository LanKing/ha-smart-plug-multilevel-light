name: Attach HACS release archive

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build HACS archive
        run: |
          cd custom_components/smart_plug_multilevel_light
          zip -r "$GITHUB_WORKSPACE/smart-plug-multilevel-light.zip" .

      - name: Upload HACS archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "smart-plug-multilevel-light.zip" \
            --clobber
