name: Normalize README image spacing once

on:
  push:
    paths:
      - ".github/workflows/normalize-readme-image-breaks-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize image line breaks in all READMEs
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path("README.md"), *sorted(Path("docs").glob("README_*.md"))]
          changed = []

          for path in files:
              text = path.read_text(encoding="utf-8")
              original = text

              text = re.sub(
                  r'(<img\s+src="[^"]*modes-edit\.png"\s+width="465"\s*/>)(?:\s*<br\s*/>)*',
                  r'\1<br /><br />\n',
                  text,
              )
              text = re.sub(
                  r'(<img\s+src="[^"]*modes-list\.png"\s+width="457"\s*/>)(?:\s*<br\s*/>)*',
                  r'\1<br />\n',
                  text,
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print(f"Changed {len(changed)} README files")
          for path in changed:
              print(path)

          if len(changed) != len(files):
              print(f"Processed {len(files)} files; some were already normalized.")

      - name: Verify all READMEs
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path("README.md"), *sorted(Path("docs").glob("README_*.md"))]
          for path in files:
              text = path.read_text(encoding="utf-8")
              if not re.search(r'<img\s+src="[^"]*modes-edit\.png"\s+width="465"\s*/><br /><br />', text):
                  raise SystemExit(f"Bad modes-edit spacing in {path}")
              if not re.search(r'<img\s+src="[^"]*modes-list\.png"\s+width="457"\s*/><br />', text):
                  raise SystemExit(f"Bad modes-list spacing in {path}")
          print(f"Verified {len(files)} README files")

      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-readme-image-breaks-once.yml
          git add README.md docs/README_*.md
          git commit -m "Normalize README image spacing"
          git pull --rebase
          git push
