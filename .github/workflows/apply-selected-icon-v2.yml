name: Apply selected integration icon v2

on:
  push:
    paths:
      - '.github/workflows/apply-selected-icon-v2.yml'
      - 'custom_components/smart_plug_multilevel_light/brand/source.b64'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Decode and prepare Home Assistant brand icons
        shell: bash
        run: |
          base64 -d custom_components/smart_plug_multilevel_light/brand/source.b64 > /tmp/source.webp
          python - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path

          src = Image.open('/tmp/source.webp').convert('RGB')
          if src.size != (128, 128):
              raise RuntimeError(f'Unexpected staged source size: {src.size}')

          brand = Path('custom_components/smart_plug_multilevel_light/brand')
          src.resize((256, 256), Image.Resampling.LANCZOS).save(
              brand / 'icon.png', format='PNG', optimize=True, compress_level=9
          )
          src.resize((512, 512), Image.Resampling.LANCZOS).save(
              brand / 'icon@2x.png', format='PNG', optimize=True, compress_level=9
          )

          manifest = Path('custom_components/smart_plug_multilevel_light/manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '0.7.17'
          manifest.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify generated assets
        run: |
          python - <<'PY'
          from PIL import Image
          checks = [
              ('custom_components/smart_plug_multilevel_light/brand/icon.png', (256, 256)),
              ('custom_components/smart_plug_multilevel_light/brand/icon@2x.png', (512, 512)),
          ]
          for path, expected in checks:
              actual = Image.open(path).size
              if actual != expected:
                  raise SystemExit(f'{path}: expected {expected}, got {actual}')
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm custom_components/smart_plug_multilevel_light/brand/source.b64
          rm -f custom_components/smart_plug_multilevel_light/brand/icon-new.tmp custom_components/smart_plug_multilevel_light/brand/icon-prefix.tmp
          git add -A custom_components/smart_plug_multilevel_light/brand custom_components/smart_plug_multilevel_light/manifest.json
          git commit -m 'Use selected integration icon and bump to 0.7.17'
          git push
