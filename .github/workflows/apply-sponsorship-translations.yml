name: Apply sponsorship translations

on:
  push:
    paths:
      - .github/workflows/apply-sponsorship-translations.yml

permissions:
  contents: write

concurrency:
  group: apply-sponsorship-translations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translator
        run: pip install deep-translator==1.11.4

      - name: Add translated sponsorship badge and section
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re
          import time
          from deep_translator import GoogleTranslator

          TARGETS = {
              "af":"af","ar":"ar","bg":"bg","bn":"bn","bs":"bs","ca":"ca","cs":"cs",
              "cy":"cy","da":"da","de":"de","el":"el","eo":"eo","es":"es","et":"et","eu":"eu",
              "fa":"fa","fi":"fi","fy":"fy","fr":"fr","ga":"ga","gl":"gl","gsw":"de","he":"iw",
              "hi":"hi","hr":"hr","hu":"hu","hy":"hy","id":"id","is":"is","it":"it","ja":"ja",
              "ka":"ka","ko":"ko","lb":"lb","lt":"lt","lv":"lv","mk":"mk","ml":"ml","nb":"no",
              "nl":"nl","nn":"no","pl":"pl","pt":"pt","pt-BR":"pt","ro":"ro","ru":"ru","sk":"sk",
              "sl":"sl","sq":"sq","sr":"sr","sr-Latn":"sr","sv":"sv","ta":"ta","te":"te","th":"th",
              "tr":"tr","uk":"uk","ur":"ur","vi":"vi","zh-Hans":"zh-CN","zh-Hant":"zh-TW"
          }

          SOURCE_PARTS = [
              "Support my work",
              "Your support",
              "If this project saved you some time, you can",
              "support my experiments on GitHub Sponsors",
          ]
          PROTECTED = {"GitHub Sponsors": "731951731951"}

          CYRILLIC = str.maketrans({
              "А":"A","Б":"B","В":"V","Г":"G","Д":"D","Ђ":"Đ","Е":"E","Ж":"Ž","З":"Z",
              "И":"I","Ј":"J","К":"K","Л":"L","Љ":"Lj","М":"M","Н":"N","Њ":"Nj","О":"O",
              "П":"P","Р":"R","С":"S","Т":"T","Ћ":"Ć","У":"U","Ф":"F","Х":"H","Ц":"C",
              "Ч":"Č","Џ":"Dž","Ш":"Š","а":"a","б":"b","в":"v","г":"g","д":"d","ђ":"đ",
              "е":"e","ж":"ž","з":"z","и":"i","ј":"j","к":"k","л":"l","љ":"lj","м":"m",
              "н":"n","њ":"nj","о":"o","п":"p","р":"r","с":"s","т":"t","ћ":"ć","у":"u",
              "ф":"f","х":"h","ц":"c","ч":"č","џ":"dž","ш":"š",
          })

          def protect(text):
              for source, token in PROTECTED.items():
                  text = text.replace(source, token)
              return text

          def restore(text):
              for source, token in PROTECTED.items():
                  text = text.replace(token, source)
              return text

          def translate_parts(target, latin_serbian=False):
              markers = [f"731947{index:06d}" for index in range(1, len(SOURCE_PARTS) + 1)]
              source = "\n".join(f"{m}\n{protect(v)}" for m, v in zip(markers, SOURCE_PARTS))
              last = None
              for attempt in range(5):
                  try:
                      translated = GoogleTranslator(source="en", target=target).translate(source)
                      if not translated:
                          raise RuntimeError("empty translation")
                      positions = [translated.find(marker) for marker in markers]
                      if any(pos < 0 for pos in positions):
                          raise RuntimeError("translation markers were changed")
                      values = []
                      for i, marker in enumerate(markers):
                          start = positions[i] + len(marker)
                          end = positions[i + 1] if i + 1 < len(markers) else len(translated)
                          values.append(restore(translated[start:end].strip()))
                      if latin_serbian:
                          values = [value.translate(CYRILLIC) for value in values]
                      return values
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt * 2)
              raise RuntimeError(f"Translation to {target} failed: {last}")

          paths = sorted(Path("docs").glob("README_*.md"))
          codes = {path.stem.removeprefix("README_") for path in paths}
          missing = codes - set(TARGETS)
          unexpected = set(TARGETS) - codes
          if missing:
              raise RuntimeError(f"No translation target mapping for: {sorted(missing)}")
          if unexpected:
              raise RuntimeError(f"Mapped README files are missing: {sorted(unexpected)}")

          badge_pattern = re.compile(
              r'<a href="\.\./LICENSE"><img src="https://img\.shields\.io/github/license/LanKing/ha-smart-plug-multilevel-light\?cacheSeconds=300" alt="[^"]*"></a>'
          )

          cache = {}
          changed = []
          for path in paths:
              code = path.stem.removeprefix("README_")
              target = TARGETS[code]
              cache_key = (target, code == "sr-Latn")
              if cache_key not in cache:
                  cache[cache_key] = translate_parts(target, code == "sr-Latn")
                  time.sleep(0.25)
              badge_label, heading, prefix, link_text = cache[cache_key]

              text = path.read_text(encoding="utf-8")
              original = text

              if "https://github.com/sponsors/LanKing" in text:
                  print(f"already contains sponsorship: {path}")
                  continue

              badge_matches = list(badge_pattern.finditer(text))
              if len(badge_matches) != 1:
                  raise RuntimeError(f"Expected exactly one license badge in {path}, got {len(badge_matches)}")
              license_badge = badge_matches[0].group(0)
              badge = (
                  f'<a href="https://github.com/sponsors/LanKing"><img '
                  f'src="https://img.shields.io/badge/☕-{quote(badge_label, safe="")}-ea4aaa" '
                  f'alt="{badge_label}"></a>'
              )
              text = text.replace(license_badge, license_badge + " " + badge, 1)

              footer_pos = text.rfind("\n<br />")
              if footer_pos < 0:
                  raise RuntimeError(f"Final <br /> separator not found in {path}")
              section = (
                  f"\n## 👋 {heading}\n"
                  f"{prefix} [{link_text}](https://github.com/sponsors/LanKing). ☕🔧\n"
              )
              text = text[:footer_pos] + section + text[footer_pos:]

              if text.count("https://github.com/sponsors/LanKing") != 2:
                  raise RuntimeError(f"Expected exactly two sponsorship links in {path}")
              if text.count("img.shields.io/badge/☕-") != 1:
                  raise RuntimeError(f"Expected exactly one sponsorship badge in {path}")
              if "GitHub Sponsors" not in text:
                  raise RuntimeError(f"Protected GitHub Sponsors term missing in {path}")

              path.write_text(text, encoding="utf-8")
              changed.append(str(path))
              print(f"updated {path}: {badge_label!r} / {heading!r}")

          if len(changed) != len(paths):
              raise RuntimeError(f"Expected to update {len(paths)} translated READMEs, updated {len(changed)}")
          print(f"Updated {len(changed)} translated READMEs")
          PY

      - name: Validate bounded change
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          allowed = {str(path) for path in Path("docs").glob("README_*.md")}
          unexpected = [path for path in changed if path not in allowed]
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {unexpected}")
          if not changed:
              raise SystemExit("No translated README files changed")
          for path_str in changed:
              text = Path(path_str).read_text(encoding="utf-8")
              if text.count("https://github.com/sponsors/LanKing") != 2:
                  raise SystemExit(f"Wrong sponsorship link count in {path_str}")
              if "GitHub Sponsors" not in text:
                  raise SystemExit(f"GitHub Sponsors was altered in {path_str}")
          print(f"Validated {len(changed)} README files")
          PY

      - name: Commit translations and remove one-time workflow
        run: |
          rm .github/workflows/apply-sponsorship-translations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/apply-sponsorship-translations.yml
          git commit -m "Translate sponsorship content across READMEs"
          git pull --rebase origin main
          git push
