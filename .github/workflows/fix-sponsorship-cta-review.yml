name: Fix sponsorship CTA review

on:
  push:
    paths:
      - .github/workflows/fix-sponsorship-cta-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed CTA wording
        run: |
          python <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re

          FIXES = {
              "ar": "ادعم عملي",
              "bn": "আমার কাজকে সমর্থন করুন",
              "es": "Apoya mi trabajo",
              "gsw": "Unterstütz mini Arbeit",
              "hy": "Աջակցեք իմ աշխատանքին",
              "pt": "Apoie o meu trabalho",
          }

          badge = re.compile(
              r'<a href="https://github\.com/sponsors/LanKing"><img src="https://img\.shields\.io/badge/☕-[^"]+-ea4aaa" alt="[^"]+"></a>'
          )

          for code, label in FIXES.items():
              path = Path(f"docs/README_{code}.md")
              text = path.read_text(encoding="utf-8")
              if len(list(badge.finditer(text))) != 1:
                  raise RuntimeError(f"Expected one sponsorship badge in {path}")
              encoded = quote(label, safe="")
              replacement = (
                  '<a href="https://github.com/sponsors/LanKing">'
                  f'<img src="https://img.shields.io/badge/☕-{encoded}-ea4aaa" alt="{label}"></a>'
              )
              path.write_text(badge.sub(replacement, text, count=1), encoding="utf-8")
              print(f"{code}: {label}")

          # Check the complete translated set after the reviewed corrections.
          paths = sorted(Path("docs").glob("README_*.md"))
          if len(paths) != 61:
              raise RuntimeError(f"Unexpected translated README count: {len(paths)}")
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count("https://github.com/sponsors/LanKing") != 2:
                  raise RuntimeError(f"Expected two sponsorship links in {path}")
              if "<img src=\"https://img.shields.io/badge/☕-" not in text:
                  raise RuntimeError(f"Missing sponsorship badge in {path}")
          uk = Path("docs/README_uk.md").read_text(encoding="utf-8")
          assert "Підтримайте мою роботу" in uk
          assert "Підтримуйте мою роботу" not in uk
          es = Path("docs/README_es.md").read_text(encoding="utf-8")
          assert 'alt="Apoya mi trabajo"' in es
          hy = Path("docs/README_hy.md").read_text(encoding="utf-8")
          assert 'alt="Աջակցեք իմ աշխատանքին"' in hy
          print("Reviewed all 61 translated sponsorship badges; targeted language fixes applied.")
          PY
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/fix-sponsorship-cta-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs .github/workflows/fix-sponsorship-cta-review.yml
          git commit -m "Polish sponsorship CTA translations"
          git pull --rebase origin main
          git push
