name: Normalize README image src once

on:
  push:
    paths:
      - ".github/workflows/normalize-readme-image-src-once.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize README image sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          repo_raw = 'https://raw.githubusercontent.com/LanKing/ha-smart-plug-multilevel-light/main/'
          paths = [Path('README.md'), *sorted(Path('docs').glob('README_*.md'))]

          def repl_src(match, path):
              src = match.group(1)
              if src.startswith(('http://', 'https://', 'data:')):
                  return match.group(0)
              if src.startswith('#'):
                  return match.group(0)
              if path.parent == Path('docs'):
                  rel = src
                  if rel.startswith('../'):
                      rel = rel[3:]
                  elif not rel.startswith('docs/'):
                      rel = 'docs/' + rel
              else:
                  rel = src
              rel = rel.lstrip('./')
              return f'src="{repo_raw}{rel}"'

          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'src="([^"]+)"', lambda m: repl_src(m, path), text)
              # Markdown images too, if any relative ones exist.
              def md_repl(m):
                  alt, src = m.group(1), m.group(2)
                  if src.startswith(('http://','https://','data:','#')):
                      return m.group(0)
                  if path.parent == Path('docs'):
                      rel = src
                      if rel.startswith('../'):
                          rel = rel[3:]
                      elif not rel.startswith('docs/'):
                          rel = 'docs/' + rel
                  else:
                      rel = src
                  rel = rel.lstrip('./')
                  return f'![{alt}]({repo_raw}{rel})'
              new = re.sub(r'!\[([^\]]*)\]\(([^)\s]+)\)', md_repl, new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('\n'.join(changed) if changed else 'No changes')

          # fail if any relative image sources remain
          bad = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for m in re.finditer(r'src="([^"]+)"', text):
                  src = m.group(1)
                  if not src.startswith(('http://','https://','data:','#')):
                      bad.append(f'{path}: {src}')
              for m in re.finditer(r'!\[[^\]]*\]\(([^)\s]+)\)', text):
                  src = m.group(1)
                  if not src.startswith(('http://','https://','data:','#')):
                      bad.append(f'{path}: {src}')
          if bad:
              raise SystemExit('Relative image sources remain:\n' + '\n'.join(bad))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- README.md docs/README_*.md; then
            echo "No README image changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md docs/README_*.md
            git commit -m "Use absolute README image URLs"
            git push
          fi
      - name: Remove this workflow
        run: |
          git pull --rebase
          git rm .github/workflows/normalize-readme-image-src-once.yml
          git commit -m "Remove one-time README image workflow"
          git push
